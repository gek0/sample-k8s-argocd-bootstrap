apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: crossplane
  namespace: argocd
spec:
  description: Crossplane infrastructure resources (AWS S3, etc.)

  sourceRepos:
    - 'https://github.com/gek0/sample-k8s-gitops.git'

  destinations:
    - namespace: crossplane-system
      name: in-cluster

  clusterResourceWhitelist:
    - group: 's3.aws.upbound.io'
      kind: 'Bucket'

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

  orphanedResources:
    warn: false

  permitOnlyProjectScopedClusters: false
