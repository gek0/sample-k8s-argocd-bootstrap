apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: github-personal
  namespace: argocd
spec:
  description: Personal GitHub project with various aplications

  sourceRepos:
  - 'https://github.com/gek0/sample-k8s-app.git'
  - 'https://github.com/gek0/sample-k8s-gitops.git'
  - 'https://grafana.github.io/helm-charts'
  - 'https://prometheus-community.github.io/helm-charts'

  destinations:
  - namespace: 'github-personal-*'
    name: in-cluster
  - namespace: argocd
    name: in-cluster
  - namespace: monitoring
    name: in-cluster

  clusterResourceWhitelist:
    - group: '*'
      kind: '*'

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

  orphanedResources:
    warn: false

  permitOnlyProjectScopedClusters: false
